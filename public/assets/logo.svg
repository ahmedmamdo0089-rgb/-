<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162856" />
      <stop offset="100%" stop-color="#080f23" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#f5b942" />
      <stop offset="100%" stop-color="#b7791f" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- درع الخلفية الملكي -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />
  <rect x="40" y="40" width="432" height="432" rx="86" fill="none" stroke="#ffd166" stroke-opacity="0.28" stroke-width="3" />

  <!-- قرص الشمس الذهبي -->
  <circle cx="256" cy="158" r="54" fill="url(#goldGrad)" opacity="0.25" />
  <circle cx="256" cy="158" r="38" fill="url(#goldGrad)" opacity="0.5" />

  <!-- برج القاهرة المبسط -->
  <g filter="url(#softShadow)">
    <rect x="242" y="88" width="28" height="145" rx="6" fill="url(#goldGrad)" />
    <ellipse cx="256" cy="92" rx="20" ry="8" fill="#ffe082" />
    <line x1="256" y1="68" x2="256" y2="88" stroke="#ffe082" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- أهرامات الجيزة الذهبية -->
  <g filter="url(#softShadow)">
    <polygon points="96,312 196,168 296,312" fill="url(#goldGrad)" />
    <polygon points="196,168 296,312 246,312" fill="#c98a18" opacity="0.45" />
    <polygon points="218,312 316,182 414,312" fill="url(#goldGrad)" />
    <polygon points="316,182 414,312 365,312" fill="#b7791f" opacity="0.5" />
  </g>

  <!-- شريط لوحة بنك الحظ الزمردي -->
  <g filter="url(#softShadow)">
    <rect x="68" y="302" width="376" height="58" rx="16" fill="url(#emeraldGrad)" stroke="#ffd166" stroke-width="5" />
    <line x1="158" y1="302" x2="158" y2="360" stroke="#ffd166" stroke-width="4" opacity="0.7" />
    <line x1="256" y1="302" x2="256" y2="360" stroke="#ffd166" stroke-width="4" opacity="0.7" />
    <line x1="354" y1="302" x2="354" y2="360" stroke="#ffd166" stroke-width="4" opacity="0.7" />
  </g>

  <!-- حجر النرد الأمامي -->
  <g transform="translate(196, 326) rotate(-10)" filter="url(#softShadow)">
    <rect x="0" y="0" width="118" height="118" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="5" />
    <circle cx="32" cy="32" r="9" fill="#0f172a" />
    <circle cx="86" cy="32" r="9" fill="#0f172a" />
    <circle cx="59" cy="59" r="11" fill="#dc2626" />
    <circle cx="32" cy="86" r="9" fill="#0f172a" />
    <circle cx="86" cy="86" r="9" fill="#0f172a" />
  </g>

  <!-- عملات ذهبية جانبية -->
  <circle cx="122" cy="404" r="24" fill="url(#goldGrad)" stroke="#fff8e1" stroke-width="3" filter="url(#softShadow)" />
  <text x="122" y="412" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-weight="900" font-size="22" fill="#162032">ج</text>

  <circle cx="390" cy="396" r="26" fill="url(#goldGrad)" stroke="#fff8e1" stroke-width="3" filter="url(#softShadow)" />
  <text x="390" y="405" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-weight="900" font-size="24" fill="#162032">★</text>
</svg>

