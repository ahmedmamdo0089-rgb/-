<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#152046" />
      <stop offset="70%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7cd" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- الإطار الملكي الذهبي ذو النقش العربي -->
  <circle cx="256" cy="256" r="240" fill="url(#skyGrad)" stroke="url(#goldRim)" stroke-width="16" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 6" />

  <!-- هلال ونجوم السماء العربية -->
  <g fill="#ffd54f">
    <path d="M 230 75 A 32 32 0 1 0 262 107 A 26 26 0 1 1 230 75 Z" opacity="0.9" />
    <circle cx="285" cy="85" r="3" />
    <circle cx="195" cy="115" r="2.5" />
    <circle cx="330" cy="120" r="3" />
    <circle cx="150" cy="140" r="2" />
    <circle cx="365" cy="155" r="2" />
  </g>

  <!-- القصر العربي ذو القباب والمآذن الذهبية -->
  <g filter="url(#glow)">
    <!-- المئذنة اليسرى -->
    <rect x="135" y="160" width="18" height="110" rx="3" fill="url(#goldBright)" />
    <polygon points="144,130 132,160 156,160" fill="url(#goldBright)" />
    <!-- المئذنة اليمنى -->
    <rect x="359" y="160" width="18" height="110" rx="3" fill="url(#goldBright)" />
    <polygon points="368,130 356,160 380,160" fill="url(#goldBright)" />
    <!-- القبة المركزية الكبرى -->
    <path d="M 196 270 C 196 175, 316 175, 316 270 Z" fill="url(#goldBright)" />
    <!-- رأس القبة والهلال -->
    <line x1="256" y1="175" x2="256" y2="152" stroke="#fff" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="148" r="5" fill="#fff" />
    <!-- مبنى القصر والأقواس الأندلسية -->
    <rect x="165" y="260" width="182" height="70" fill="url(#goldRim)" />
    <!-- بوابات مقوسة -->
    <path d="M 230 330 A 26 26 0 0 1 282 330 Z" fill="#080d1e" />
    <path d="M 182 330 A 16 16 0 0 1 214 330 Z" fill="#080d1e" />
    <path d="M 298 330 A 16 16 0 0 1 330 330 Z" fill="#080d1e" />
  </g>

  <!-- حجرا النرد ثلاثيا الأبعاد بالذهب والأبيض -->
  <g filter="url(#glow)">
    <!-- نرد يسار -->
    <rect x="180" y="325" width="60" height="60" rx="12" fill="#ffffff" stroke="url(#goldRim)" stroke-width="4" />
    <circle cx="210" cy="355" r="6" fill="#d97706" />
    <circle cx="195" cy="340" r="5" fill="#d97706" />
    <circle cx="225" cy="370" r="5" fill="#d97706" />
    <!-- نرد يمين -->
    <rect x="272" y="325" width="60" height="60" rx="12" fill="#ffffff" stroke="url(#goldRim)" stroke-width="4" />
    <circle cx="302" cy="355" r="7" fill="#b91c1c" />
    <!-- عملات ذهبية وجواهر زمردية -->
    <circle cx="150" cy="375" r="18" fill="url(#goldBright)" stroke="#78350f" stroke-width="2" />
    <circle cx="362" cy="375" r="18" fill="url(#goldBright)" stroke="#78350f" stroke-width="2" />
    <polygon points="256,365 264,378 256,391 248,378" fill="url(#emeraldGrad)" />
  </g>

  <!-- شريط العنوان الملكي: بنك الحظ العربي -->
  <g filter="url(#glow)">
    <path d="M 90 415 Q 256 395 422 415 L 436 465 Q 256 450 76 465 Z" fill="url(#goldRim)" stroke="#ffe082" stroke-width="2" />
    <text x="256" y="445" font-family="'Cairo', 'Amiri', 'Tajawal', sans-serif" font-weight="900" font-size="29" fill="#080f24" text-anchor="middle" letter-spacing="1">
      بنك الحظ العربي
    </text>
  </g>
</svg>
